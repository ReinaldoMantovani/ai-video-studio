[package]
name = "ai-video-studio"
description = "AI Video Studio — aplicação desktop (Tauri 2)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ai_video_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
avs-app.workspace = true
avs-core.workspace = true
avs-media.workspace = true
avs-store.workspace = true
avs-ai.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[features]
# Usado pelo `tauri build` para embutir o frontend.
custom-protocol = ["tauri/custom-protocol"]
