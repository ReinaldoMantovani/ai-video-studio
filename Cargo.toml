[workspace]
resolver = "2"
members = [
    "crates/avs-core",
    "crates/avs-media",
    "crates/avs-store",
    "crates/avs-ai",
    "crates/avs-app",
    "crates/avs-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.8.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
ts-rs = { version = "12", features = ["uuid-impl", "serde-json-impl"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tempfile = "3"
rusqlite = { version = "0.37", features = ["bundled"] }
sysinfo = "0.37"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
sha2 = "0.10"
hex = "0.4"
avs-core = { path = "crates/avs-core" }
avs-media = { path = "crates/avs-media" }
avs-store = { path = "crates/avs-store" }
avs-ai = { path = "crates/avs-ai" }
avs-app = { path = "crates/avs-app" }

[profile.release]
lto = "thin"
codegen-units = 4
